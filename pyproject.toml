[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ferment-log-collector"
version = "0.1.1"
description = "Local collector for BrewPi-ESP glycol event archives."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
packages = ["ferment_log_collector"]
include-package-data = true

[tool.setuptools.package-data]
ferment_log_collector = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.png",
    "static/assets/*.png",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
